plugins {
    id 'org.openjfx.javafxplugin' version '0.0.13'
    id 'com.google.protobuf' version '0.9.2'
}

javafx {
    version = '21'
    modules = ['javafx.controls', 'javafx.fxml']
}

def grpcVersion = '1.54.0'
def protobufVersion = '3.22.0'

dependencies {
    implementation project(':ProjectModel')
    implementation project(':ProjectServices')

    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}
sourceSets {
    main {
        java {
            srcDirs 'src/main/java', 'build/generated/source/proto/main/grpc', 'build/generated/source/proto/main/java'
        }
    }
}