<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Exercise 3</title>
</head>
<body>
    <div class="container">
        <div class="select-id">
            <label for="select-contact-id">Select ID</label>
            <select id="select-contact-id"></select>
        </div>
        <form id="form-contact">
            <div>
                <label for="input-last-name">Last Name</label>
                <input id="input-last-name" type="text">
            </div>
            <div>
                <label for="input-first-name">First Name</label>
                <input id="input-first-name" type="text">
            </div>
            <div>
                <label for="input-phone">Phone</label>
                <input id="input-phone" type="text">
            </div>
            <div>
                <label for="input-email">Email</label>
                <input id="input-email" type="email">
            </div>
            <button id="btn-save" type="submit" disabled>Save</button>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="index-jquery.js"></script>

    <!-- <script src="index.js"></script> -->
</body>
</html>
